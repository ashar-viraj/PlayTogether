# Builds PlayTogether for Linux and Windows on every push and pull request, so neither platform
# breaks the other. Pushing a version tag (e.g. `git tag v0.2.0 && git push origin v0.2.0`)
# also publishes a GitHub release with both binaries, which install.sh / install.ps1 download.
name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install PipeWire and clang headers
        run: sudo apt-get update && sudo apt-get install -y libpipewire-0.3-dev libclang-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - run: cargo test --release
      - run: cp target/release/Playtogether playtogether-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: playtogether-linux-x86_64
          path: playtogether-linux-x86_64

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release
      - run: cargo test --release
      - run: copy target\release\Playtogether.exe playtogether-windows-x64.exe
        shell: cmd
      - uses: actions/upload-artifact@v4
        with:
          name: playtogether-windows-x64.exe
          path: playtogether-windows-x64.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            playtogether-linux-x86_64
            playtogether-windows-x64.exe
          generate_release_notes: true
